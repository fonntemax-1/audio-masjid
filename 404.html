<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TV-Sholat</title>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var routing = (params.get('routing') || params.get('masjid') || '').trim().toLowerCase();

        if (/^m\d+$/.test(routing)) {
          var path = window.location.pathname;
          if (!path.endsWith('/')) path += '/';
          window.history.replaceState(
            { shortMasjidRouting: routing },
            '',
            path + routing
          );
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <p>Memuat TV-Sholat...</p>
</body>
</html>
