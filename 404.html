<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TV-Sholat</title>
  <script>
    (function () {
      try {
        var path = window.location.pathname || '';
        var parts = path.split('/').filter(Boolean);
        var candidate = parts.length ? parts[parts.length - 1].toLowerCase() : '';

        // GitHub Pages mengirim /m0010 ke 404.html.
        // Arahkan kembali ke index.html dengan routing tenant.
        if (/^m\d+$/.test(candidate)) {
          var base = path.substring(0, path.lastIndexOf('/'));
          if (!base) base = '/';
          var target = base.replace(/\/$/, '') + '/?routing=' + encodeURIComponent(candidate);
          window.location.replace(target);
          return;
        }

        window.location.replace('./index.html');
      } catch (e) {
        window.location.replace('./index.html');
      }
    })();
  </script>
</head>
<body>
  <p>Memuat TV-Sholat...</p>
</body>
</html>
