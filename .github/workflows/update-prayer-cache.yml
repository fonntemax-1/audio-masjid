name: Update Prayer Schedule Cache - Multi Kota

on:
  schedule:
    # Cek setiap jam. Setiap kota diperbarui saat tanggal lokalnya
    # berubah atau ketika cache kota tersebut belum tersedia.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prayer-cache:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Update cache jadwal sholat semua kota
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from zoneinfo import ZoneInfo

          LOCATION_FILE = "data/lokasi-muslimkita.json"
          CACHE_FILE = "data/prayer-cache.json"
          API_BASE = "https://www.muslimkita.id/api/jadwal-sholat/v1/"

          with open(LOCATION_FILE, "r", encoding="utf-8") as f:
              locations = json.load(f)

          is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          required = [
              "subuh",
              "terbit",
              "dzuhur",
              "ashar",
              "maghrib",
              "isya",
          ]

          def normalize_time(value):
              value = str(value or "").strip()
              if re.fullmatch(r"(?:[01]?\d|2[0-3])[.]\d{2}", value):
                  value = value.replace(".", ":")
              return value

          def valid_schedule(jadwal):
              return all(
                  re.fullmatch(
                      r"(?:[01]?\d|2[0-3]):[0-5]\d",
                      normalize_time(jadwal.get(k, ""))
                  )
                  for k in required
              )

          def fetch_city(location):
              slug = str(location.get("slug") or "").strip()
              kota = str(location.get("kota") or "").strip()
              provinsi = str(location.get("provinsi") or "").strip()
              timezone = str(location.get("timezone") or "").strip()
              zona = str(location.get("zona") or "").strip()
              gmt = str(location.get("gmt") or "").strip()

              allowed = {
                  "Asia/Jakarta": "WIB",
                  "Asia/Makassar": "WITA",
                  "Asia/Jayapura": "WIT",
              }

              if not slug or timezone not in allowed:
                  return None, "lokasi tidak valid: " + kota

              now_local = datetime.now(ZoneInfo(timezone))
              date_string = now_local.strftime("%Y-%m-%d")

              url = (
                  API_BASE +
                  urllib.parse.quote(slug, safe="") +
                  "?tanggal=" +
                  urllib.parse.quote(date_string, safe="") +
                  "&metode=kemenag"
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "GitHub-Actions-Prayer-Cache-MultiCity/1.0",
                      "Accept": "application/json",
                  }
              )

              try:
                  last_error = None
                  for attempt in range(1, 4):
                      try:
                          with urllib.request.urlopen(req, timeout=30) as response:
                              raw = response.read().decode("utf-8", "replace")
                          data = json.loads(raw)
                          break
                      except Exception as attempt_error:
                          last_error = attempt_error
                          if attempt < 3:
                              import time
                              time.sleep(attempt * 2)
                          else:
                              raise last_error

                  # MuslimKita dapat mengembalikan jadwal langsung,
                  # atau membungkusnya di dalam data.jadwal / data.
                  jadwal = (
                      data.get("jadwal")
                      or (
                          data.get("data", {}).get("jadwal")
                          if isinstance(data.get("data"), dict)
                          else None
                      )
                      or (
                          data.get("data")
                          if isinstance(data.get("data"), dict)
                          else None
                      )
                      or {}
                  )

                  aliases = {
                      "subuh": ["subuh", "fajr"],
                      "terbit": ["terbit", "sunrise", "syuruq"],
                      "dzuhur": ["dzuhur", "dhuhur", "dhuhr", "zuhur"],
                      "ashar": ["ashar", "asr"],
                      "maghrib": ["maghrib", "magrib"],
                      "isya": ["isya", "isha"],
                  }

                  normalized = {}
                  for field in required:
                      value = ""
                      for key in aliases[field]:
                          if key in jadwal and str(jadwal.get(key) or "").strip():
                              value = normalize_time(jadwal.get(key))
                              if value:
                                  break
                      normalized[field] = value

                  if not valid_schedule(normalized):
                      raise RuntimeError(
                          "jadwal tidak lengkap setelah normalisasi: " +
                          json.dumps(normalized, ensure_ascii=False) +
                          " RAW_KEYS=" +
                          json.dumps(list(data.keys()) if isinstance(data, dict) else [], ensure_ascii=False)
                      )

                  return {
                      "success": True,
                      "tanggal": date_string,
                      "kota": data.get("kota") or kota,
                      "provinsi": data.get("provinsi") or provinsi,
                      "slug": data.get("slug") or slug,
                      "zona": zona,
                      "timezone": timezone,
                      "gmt": gmt,
                      "source": "MuslimKita / Kemenag",
                      "jadwal": normalized,
                      "generatedAt": datetime.now(ZoneInfo("UTC")).isoformat(),
                  }, None

              except Exception as e:
                  return None, f"{kota} ({slug}): {e}"

          old = {
              "success": True,
              "generatedAt": "",
              "updatedAt": "",
              "cities": {}
          }

          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE, "r", encoding="utf-8") as f:
                      existing = json.load(f)

                  if isinstance(existing, dict):
                      if isinstance(existing.get("cities"), dict):
                          old = existing
                      elif existing.get("slug"):
                          # Migrasi otomatis dari cache satu-kota lama.
                          old["cities"] = {
                              str(existing["slug"]).strip().lower(): existing
                          }
              except Exception as e:
                  print("CACHE LAMA TIDAK DAPAT DIBACA:", e)

          cities = dict(old.get("cities") or {})
          candidates = []

          for location in locations:
              slug = str(location.get("slug") or "").strip().lower()
              timezone = str(location.get("timezone") or "").strip()

              if not slug or timezone not in {
                  "Asia/Jakarta",
                  "Asia/Makassar",
                  "Asia/Jayapura"
              }:
                  continue

              local_date = datetime.now(
                  ZoneInfo(timezone)
              ).strftime("%Y-%m-%d")

              cached = cities.get(slug) or {}
              cached_date = str(cached.get("tanggal") or "").strip()

              # Manual = refresh semua kota.
              # Scheduled = refresh hanya kota yang cache-nya belum
              # mengikuti tanggal lokal kota tersebut.
              if is_manual or cached_date != local_date:
                  candidates.append(location)

          print(
              "PRAYER CACHE MULTI-KOTA:",
              "mode=" + ("MANUAL" if is_manual else "SCHEDULED"),
              "total_kota=" + str(len(locations)),
              "perlu_update=" + str(len(candidates)),
          )

          updated = 0
          failed = []

          # Paralel terbatas agar 100+ kota tidak memakan waktu terlalu lama
          # tetapi tetap menghindari terlalu banyak request bersamaan.
          with ThreadPoolExecutor(max_workers=8) as executor:
              futures = {
                  executor.submit(fetch_city, location): location
                  for location in candidates
              }

              for future in as_completed(futures):
                  location = futures[future]
                  result, error = future.result()

                  if result:
                      cities[result["slug"].strip().lower()] = result
                      updated += 1
                      print(
                          "CACHE OK:",
                          result["kota"],
                          result["slug"],
                          result["tanggal"],
                          result["jadwal"]
                      )
                  else:
                      failed.append(error or str(location))

          payload = {
              "success": True,
              "generatedAt": datetime.now(ZoneInfo("UTC")).isoformat(),
              "updatedAt": datetime.now(ZoneInfo("UTC")).isoformat(),
              "cityCount": len(cities),
              "cities": cities,
          }

          os.makedirs("data", exist_ok=True)

          with open(CACHE_FILE, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(
              "CACHE JADWAL SHOLAT MULTI-KOTA:",
              "cityCount=",
              len(cities),
              "updated=",
              updated,
              "failed=",
              len(failed)
          )

          if failed:
              print("KOTA GAGAL:")
              for item in failed:
                  print("-", item)

          # Jangan menggagalkan workflow hanya karena sebagian kota gagal.
          # Cache kota yang berhasil tetap disimpan.
          PY

      - name: Commit cache ke GitHub
        run: |
          if git diff --quiet -- data/prayer-cache.json; then
            echo "Tidak ada perubahan cache."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prayer-cache.json
          git commit -m "Update multi-city prayer schedule cache"
          git push
