name: Convert Idul Fitri video to transparent WebM

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/convert-idul-fitri.yml"

permissions:
  contents: write

concurrency:
  group: convert-idul-fitri-video
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert only video/idul-fitri.mp4
        run: |
          test -s video/idul-fitri.mp4
          ffmpeg -y -i video/idul-fitri.mp4 \
            -vf "colorkey=0x000000:0.1:0.1,format=yuva420p" \
            -c:v libvpx-vp9 -crf 30 -b:v 0 \
            video/idul-fitri.webm
          test -s video/idul-fitri.webm
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -of default=noprint_wrappers=1 video/idul-fitri.webm

      - name: Keep conversion as an artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: idul-fitri-transparent-webm
          path: video/idul-fitri.webm
          if-no-files-found: error
          retention-days: 14

      - name: Commit converted WebM without changing the original MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/idul-fitri.webm
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Add transparent WebM version of Idul Fitri animation"
            git push
          fi
