<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Digital Signage Masjid Al Mujahidin</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    body { font-family: Arial, Helvetica, sans-serif; }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #000;
    }
    #fullscreenButton {
      position: fixed;
      right: 10px;
      bottom: 10px;
      z-index: 20;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      background: rgba(0,0,0,.35);
      color: rgba(255,255,255,.55);
      cursor: pointer;
      font-size: 12px;
      opacity: .18;
      transition: opacity .2s ease;
    }
    #fullscreenButton:hover,
    #fullscreenButton:focus { opacity: .8; }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    title="Digital Signage Masjid Al Mujahidin"
    src="https://script.google.com/macros/s/AKfycbzNR2XTJWFhvTOONtxGhIOqxWT3rDeMHDHbASASh0I8GsrAOpPX66r_X-NH5OqBUHcM/exec"
    allow="autoplay; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <button id="fullscreenButton" type="button" title="Fullscreen">⛶</button>

  <script>
    const fullscreenButton = document.getElementById('fullscreenButton');

    async function enterFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {
        console.log('Fullscreen belum diizinkan browser:', err);
      }
    }

    fullscreenButton.addEventListener('click', enterFullscreen);

    let hideTimer;
    function resetButtonTimer() {
      fullscreenButton.style.opacity = '0.18';
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        fullscreenButton.style.opacity = '0.03';
      }, 3000);
    }

    window.addEventListener('mousemove', resetButtonTimer);
    window.addEventListener('touchstart', resetButtonTimer, { passive: true });
    resetButtonTimer();
  </script>
</body>
</html>
